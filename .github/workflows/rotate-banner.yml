name: Rotate banner

on:
  schedule:
    # Every 3 hours, not once a day: GitHub starts scheduled runs late under
    # load and sometimes drops them (10-25's 06:17 run started at 11:41, and
    # 10-26's never started). The script picks by date and a run that finds
    # the banner current changes nothing, so the extra runs are free and the
    # next one covers a dropped one. The banner moves on every other day.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-banner
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set the current banner
        run: python3 scripts/rotate_banner.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Banner unchanged"
            exit 0
          fi
          banner=$(grep -o 'banners/[0-9a-z/-]*\.webp' README.md | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(banner): rotate to ${banner#banners/}"
          git push
