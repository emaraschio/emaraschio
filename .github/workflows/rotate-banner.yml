name: Rotate banner

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (03:17 in Buenos Aires)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-banner
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set this week's banner
        run: python3 scripts/rotate_banner.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Banner unchanged"
            exit 0
          fi
          banner=$(grep -o 'banners/[0-9a-z-]*\.webp' README.md | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(banner): rotate to ${banner#banners/}"
          git push
